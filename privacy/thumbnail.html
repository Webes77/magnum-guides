<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Manus Bridge Walkthrough · card</title>
<!--
  CARD SOURCE · Manus Bridge Walkthrough
  ======================================
  The 1200x630 card for the members area home page and for link previews.
  Built from ../templates/guide-thumbnail.html.

  To re-render after an edit: render at a true 1200x630 viewport, quality 90,
  and save the JPEG to ../assets/thumbnails/manus-bridge.jpg
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF9;
  --paper-deep:#FBE1D8;
  --ink:#1E1B17;
  --navy:#1F2A37;
  --coral-bright:#FF6F5E;
  --tint:#FBE1D8;
  --rust:#DE4A3C;
  --tan:#FBE1D8;
  --olive:#5B6B7A;
  --charcoal:#3A3630;
  --taupe:#7A7A7A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#1F2A37;font-family:'IBM Plex Sans',Arial,sans-serif;color:var(--ink)}

.card{
  width:1200px;height:630px;
  background-color:var(--paper);
  border:11px solid #1F2A37;
  padding:34px 42px 26px;
  display:flex;flex-direction:column;
}

.masthead{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:4px solid var(--ink);padding-bottom:12px;gap:16px}
.mh-title{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:700;font-size:23px;letter-spacing:.16em;text-transform:uppercase;line-height:1;display:block}
.mh-sub{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--charcoal);display:block;margin-top:8px}
.mh-issue{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:600;font-size:19px;letter-spacing:.1em;border:3px solid var(--ink);padding:4px 14px 5px;background:var(--paper-deep);white-space:nowrap}

.body{flex:1;display:grid;grid-template-columns:1.2fr .8fr;gap:34px;padding-top:24px;min-height:0}

.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--rust);display:flex;align-items:center;gap:12px}
.eyebrow::after{content:"";flex:1;height:3px;background:var(--ink);opacity:.85}

h1{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:700;text-transform:uppercase;line-height:.94;letter-spacing:-.005em;font-size:64px;margin-top:16px}
.kicker{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.03em;color:var(--rust);margin-top:16px}
.slug{margin-top:auto;border-top:3px solid var(--ink);padding-top:12px;display:flex;gap:26px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--charcoal)}
.slug b{font-weight:600;color:var(--rust)}
.left{display:flex;flex-direction:column;min-height:0}

.plate{background:var(--navy);border:4px solid var(--ink);padding:20px 22px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;overflow:hidden}
.doc-wrap{flex:1 1 0;display:flex;align-items:center;justify-content:center;padding-bottom:6px;min-height:0}
.doc-wrap svg{width:auto;height:100%;max-width:100%;display:block}
.plate-cap{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#F4F1EA;border-top:3px solid rgba(244,241,234,.5);padding-top:10px;margin-top:14px;line-height:1.6}

.foot{border-top:3px solid var(--ink);margin-top:20px;padding-top:11px;display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--charcoal)}
.foot .mid{color:var(--taupe)}
.foot .pg{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="card">

  <header class="masthead">
    <div>
      <span class="mh-title">Reference</span>
      <span class="mh-sub">Magnum AI</span>
    </div>
    <div class="mh-issue">AI Privacy</div>
  </header>

  <div class="body">
    <div class="left">
      <div class="eyebrow">AI Privacy</div>
      <h1>What is<br>kept, and<br>who can<br>see it.</h1>
      <div class="kicker">Private from your sidebar is not private from your employer.</div>
      <div class="slug">
        <span><b>Covers</b> Claude and ChatGPT</span>
        <span><b>Takes</b> ten minutes, once</span>
      </div>
    </div>

    <div class="plate">
      <div class="doc-wrap">
        <svg viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What you type travels to a server, is kept for a period, and can be retrieved by an administrator.">
          <!-- you -->
          <rect x="16" y="60" width="120" height="72" fill="#F4F1EA" stroke="#F4F1EA" stroke-width="4"/>
          <text x="76" y="94" text-anchor="middle" fill="#1F2A37" font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" font-size="22" letter-spacing="1">YOU TYPE</text>
          <text x="76" y="116" text-anchor="middle" fill="#5B6B7A" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2">ON YOUR LAPTOP</text>
          <!-- arrow out -->
          <path d="M140 96 L196 96" stroke="#F4F1EA" stroke-width="5" fill="none"/>
          <path d="M202 96 l-12 -7 v14 z" fill="#F4F1EA"/>
          <!-- kept -->
          <rect x="208" y="60" width="156" height="72" fill="#F4F1EA" stroke="#F4F1EA" stroke-width="4"/>
          <text x="286" y="94" text-anchor="middle" fill="#1F2A37" font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" font-size="22" letter-spacing="1">KEPT</text>
          <text x="286" y="116" text-anchor="middle" fill="#5B6B7A" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2">30 DAYS TO 5 YEARS</text>
          <!-- who it comes back to -->
          <rect x="16" y="176" width="150" height="62" fill="#F4F1EA" stroke="#F4F1EA" stroke-width="4"/>
          <text x="91" y="205" text-anchor="middle" fill="#1F2A37" font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" font-size="21" letter-spacing="1">AN ADMIN</text>
          <text x="91" y="225" text-anchor="middle" fill="#5B6B7A" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1.8">ON A WORK ACCOUNT</text>
          <!-- the one bright coral stripe: retrieval -->
          <path d="M286 140 L286 207 L178 207" stroke="#FF6F5E" stroke-width="6" fill="none"/>
          <path d="M172 207 l12 -8 v16 z" fill="#FF6F5E"/>
          <text x="364" y="170" text-anchor="end" fill="#FF6F5E" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2.2">CAN PULL IT BACK</text>
          <!-- slate ticks, the three things you control -->
          <g stroke="#5B6B7A" stroke-width="4" fill="none">
            <path d="M24 262 l9 9 l18 -20"/>
            <path d="M140 262 l9 9 l18 -20"/>
            <path d="M252 262 l9 9 l18 -20"/>
          </g>
          <text x="60" y="288" fill="#5B6B7A" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1.4">TRAINING</text>
          <text x="176" y="288" fill="#5B6B7A" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1.4">MEMORY</text>
          <text x="288" y="288" fill="#5B6B7A" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1.4">PASTING</text>
        </svg>
      </div>
    </div>
  </div>

  <footer class="foot">
    <span>magnumai.com.au</span>
    <span class="mid">Stored · Trained on · Readable</span>
    <span class="pg">Reference</span>
  </footer>

</div>
</body>
</html>
