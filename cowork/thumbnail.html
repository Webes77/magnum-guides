<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Task Work Setup Guide · card</title>
<!--
  CARD SOURCE · Task Work Setup Guide
  ================================
  The 1200x630 card for the members area home page and for link previews.
  Built from ../templates/guide-thumbnail.html.

  To re-render after an edit: render at a true 1200x630 viewport, quality 90,
  and save the JPEG to ../assets/thumbnails/cowork.jpg
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF9;
  --paper-deep:#FBE1D8;
  --ink:#1E1B17;
  --navy:#1F2A37;
  --coral-bright:#FF6F5E;
  --tint:#FBE1D8;
  --rust:#EF4029; --coral-text:#C63A2A;
  --tan:#FBE1D8;
  --olive:#5B6B7A;
  --charcoal:#3A3630;
  --taupe:#63615C;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#1F2A37;font-family:'IBM Plex Sans',Arial,sans-serif;color:var(--ink)}

.card{
  width:1200px;height:630px;
  background-color:var(--paper);
  border:11px solid #1F2A37;
  padding:34px 42px 26px;
  display:flex;flex-direction:column;
}

.masthead{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:4px solid var(--ink);padding-bottom:12px;gap:16px}
.mh-title{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:700;font-size:23px;letter-spacing:.16em;text-transform:uppercase;line-height:1;display:block}
.mh-sub{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--charcoal);display:block;margin-top:8px}
.mh-issue{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:600;font-size:19px;letter-spacing:.1em;border:3px solid var(--ink);padding:4px 14px 5px;background:var(--paper-deep);white-space:nowrap}

.body{flex:1;display:grid;grid-template-columns:1.2fr .8fr;gap:34px;padding-top:24px;min-height:0}

.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--coral-text);display:flex;align-items:center;gap:12px}
.eyebrow::after{content:"";flex:1;height:3px;background:var(--ink);opacity:.85}

h1{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:700;text-transform:uppercase;line-height:.94;letter-spacing:-.005em;font-size:64px;margin-top:16px}
.kicker{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.03em;color:var(--rust);margin-top:16px}
.slug{margin-top:auto;border-top:3px solid var(--ink);padding-top:12px;display:flex;gap:26px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--charcoal)}
.slug b{font-weight:600;color:var(--rust)}
.left{display:flex;flex-direction:column;min-height:0}

.plate{background:var(--navy);border:4px solid var(--ink);padding:20px 22px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;overflow:hidden}
.doc-wrap{flex:1 1 0;display:flex;align-items:center;justify-content:center;padding-bottom:6px;min-height:0}
.doc-wrap svg{width:auto;height:100%;max-width:100%;display:block}
.plate-cap{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#F4F1EA;border-top:3px solid rgba(244,241,234,.5);padding-top:10px;margin-top:14px;line-height:1.6}

.foot{border-top:3px solid var(--ink);margin-top:20px;padding-top:11px;display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--charcoal)}
.foot .mid{color:var(--taupe)}
.foot .pg{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="card">

  <header class="masthead">
    <div>
      <span class="mh-title">Reference</span>
      <span class="mh-sub">Magnum AI</span>
    </div>
    <div class="mh-issue">Task work</div>
  </header>

  <div class="body">
    <div class="left">
      <div class="eyebrow">Task work</div>
      <h1>What it is,<br>and how<br>to set<br>it up.</h1>
      <div class="kicker">A chat answers you. Task work does the job.</div>
      <div class="slug">
        <span><b>Setup</b> six steps, fifteen minutes</span>
        <span><b>Then</b> five prompts to run</span>
      </div>
    </div>

    <div class="plate">
      <div class="doc-wrap">
        <svg viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A chat turns a question into an answer. Task work turns a job into finished work by running its own steps.">
          <!-- CHAT -->
          <text x="16" y="34" fill="#FF6F5E" font-family="'IBM Plex Mono',monospace" font-size="12" font-weight="500" letter-spacing="3">A CHAT</text>
          <rect x="16" y="46" width="134" height="56" fill="#F4F1EA" stroke="#F4F1EA" stroke-width="4"/>
          <text x="83" y="72" text-anchor="middle" fill="#1F2A37" font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" font-size="20" letter-spacing="1">YOU ASK</text>
          <text x="83" y="90" text-anchor="middle" fill="#5B6B7A" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1.8">ONE MESSAGE</text>
          <path d="M156 74 L206 74" stroke="#F4F1EA" stroke-width="5" fill="none"/>
          <path d="M212 74 l-12 -7 v14 z" fill="#F4F1EA"/>
          <rect x="218" y="46" width="146" height="56" fill="#F4F1EA" stroke="#F4F1EA" stroke-width="4"/>
          <text x="291" y="72" text-anchor="middle" fill="#1F2A37" font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" font-size="20" letter-spacing="1">AN ANSWER</text>
          <text x="291" y="90" text-anchor="middle" fill="#5B6B7A" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1.8">YOU DRIVE THE NEXT</text>

          <!-- rule -->
          <path d="M16 128 L364 128" stroke="#5B6B7A" stroke-width="2" fill="none"/>

          <!-- TASK WORK -->
          <text x="16" y="164" fill="#FF6F5E" font-family="'IBM Plex Mono',monospace" font-size="12" font-weight="500" letter-spacing="3">TASK WORK</text>
          <rect x="16" y="176" width="134" height="56" fill="#FF6F5E" stroke="#FF6F5E" stroke-width="4"/>
          <text x="83" y="202" text-anchor="middle" fill="#1E1B17" font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" font-size="20" letter-spacing="1">YOU HAND</text>
          <text x="83" y="220" text-anchor="middle" fill="#1E1B17" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1.8">OVER A JOB</text>

          <!-- its own steps -->
          <path d="M156 204 L176 204" stroke="#F4F1EA" stroke-width="5" fill="none"/>
          <rect x="182" y="190" width="26" height="28" fill="none" stroke="#F4F1EA" stroke-width="3"/>
          <rect x="216" y="190" width="26" height="28" fill="none" stroke="#F4F1EA" stroke-width="3"/>
          <rect x="250" y="190" width="26" height="28" fill="none" stroke="#F4F1EA" stroke-width="3"/>
          <path d="M282 204 L300 204" stroke="#F4F1EA" stroke-width="5" fill="none"/>
          <path d="M306 204 l-12 -7 v14 z" fill="#F4F1EA"/>
          <text x="229" y="248" text-anchor="middle" fill="#C8CDD3" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1.8">ITS OWN STEPS</text>

          <rect x="312" y="176" width="52" height="56" fill="#F4F1EA" stroke="#F4F1EA" stroke-width="4"/>
          <text x="338" y="199" text-anchor="middle" fill="#1F2A37" font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" font-size="17" letter-spacing="1">THE</text>
          <text x="338" y="218" text-anchor="middle" fill="#1F2A37" font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" font-size="17" letter-spacing="1">WORK</text>

          <text x="16" y="284" fill="#C8CDD3" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1.6">YOUR FILES · YOUR CONNECTORS · ON A SCHEDULE</text>
        </svg>
      </div>
    </div>
  </div>

</div>
</body>
</html>
