<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Build Your Brand DNA · card</title>
<!--
  CARD SOURCE · Build Your Brand DNA
  ================================
  The 1200x630 card for the members area home page and for link previews.
  Built from ../templates/guide-thumbnail.html.

  To re-render after an edit: render at a true 1200x630 viewport, quality 90,
  and save the JPEG to ../assets/thumbnails/brand-dna.jpg
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF9;
  --paper-deep:#FBE1D8;
  --ink:#1E1B17;
  --navy:#1F2A37;
  --coral-bright:#FF6F5E;
  --tint:#FBE1D8;
  --rust:#EF4029; --coral-text:#C63A2A;
  --tan:#FBE1D8;
  --olive:#5B6B7A;
  --charcoal:#3A3630;
  --taupe:#63615C;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#1F2A37;font-family:'IBM Plex Sans',Arial,sans-serif;color:var(--ink)}

.card{
  width:1200px;height:630px;
  background-color:var(--paper);
  border:11px solid #1F2A37;
  padding:34px 42px 26px;
  display:flex;flex-direction:column;
}

.masthead{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:4px solid var(--ink);padding-bottom:12px;gap:16px}
.mh-title{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:700;font-size:23px;letter-spacing:.16em;text-transform:uppercase;line-height:1;display:block}
.mh-sub{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--charcoal);display:block;margin-top:8px}
.mh-issue{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:600;font-size:19px;letter-spacing:.1em;border:3px solid var(--ink);padding:4px 14px 5px;background:var(--paper-deep);white-space:nowrap}

.body{flex:1;display:grid;grid-template-columns:1.2fr .8fr;gap:34px;padding-top:24px;min-height:0}

.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--coral-text);display:flex;align-items:center;gap:12px}
.eyebrow::after{content:"";flex:1;height:3px;background:var(--ink);opacity:.85}

h1{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:700;text-transform:uppercase;line-height:.94;letter-spacing:-.005em;font-size:64px;margin-top:16px}
.kicker{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.03em;color:var(--rust);margin-top:16px}
.slug{margin-top:auto;border-top:3px solid var(--ink);padding-top:12px;display:flex;gap:26px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--charcoal)}
.slug b{font-weight:600;color:var(--rust)}
.left{display:flex;flex-direction:column;min-height:0}

.plate{background:var(--navy);border:4px solid var(--ink);padding:20px 22px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;overflow:hidden}
.doc-wrap{flex:1 1 0;display:flex;align-items:center;justify-content:center;padding-bottom:6px;min-height:0}
.doc-wrap svg{width:auto;height:100%;max-width:100%;display:block}
.plate-cap{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#F4F1EA;border-top:3px solid rgba(244,241,234,.5);padding-top:10px;margin-top:14px;line-height:1.6}

.foot{border-top:3px solid var(--ink);margin-top:20px;padding-top:11px;display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--charcoal)}
.foot .mid{color:var(--taupe)}
.foot .pg{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="card">

  <header class="masthead">
    <div>
      <span class="mh-title">Reference</span>
      <span class="mh-sub">Magnum AI</span>
    </div>
    <div class="mh-issue">Brand DNA</div>
  </header>

  <div class="body">
    <div class="left">
      <div class="eyebrow">Task work</div>
      <h1>Build your<br>brand DNA.</h1>
      <div class="kicker">One folder every AI tool reads before it makes anything.</div>
      <div class="slug">
        <span><b>Eleven</b> stages, every prompt ready</span>
        <span><b>One</b> master file</span>
      </div>
    </div>

    <div class="plate">
      <div class="doc-wrap">
        <svg viewBox="0 0 380 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A folder called brand-dna. brand-dna.md at the top, read first, with voice, visuals, image style, channels and the changelog beneath it.">
          <rect x="8" y="8" width="364" height="48" fill="#FF6F5E"/>
          <text x="22" y="30" fill="#1F2A37" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1.6">MASTER · READ FIRST</text>
          <text x="22" y="48" fill="#1E1B17" font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" font-size="17" letter-spacing="1">BRAND-DNA.MD · 16 SECTIONS</text>
          <path d="M40 56 L40 252" stroke="#F4F1EA" stroke-width="3"/>
          <g font-family="Oswald,'Arial Narrow',sans-serif" font-weight="700" font-size="15" letter-spacing="1" fill="#1E1B17">
            <path d="M40 86 L64 86 M40 124 L64 124 M40 162 L64 162 M40 200 L64 200 M40 238 L64 238" stroke="#F4F1EA" stroke-width="3"/>
            <rect x="64" y="70" width="190" height="32" fill="#F4F1EA"/><text x="76" y="92">VOICE.MD</text>
            <rect x="64" y="108" width="190" height="32" fill="#F4F1EA"/><text x="76" y="130">VISUALS.MD</text>
            <rect x="64" y="146" width="190" height="32" fill="#F4F1EA"/><text x="76" y="168">IMAGE-STYLE.MD</text>
            <rect x="64" y="184" width="190" height="32" fill="#F4F1EA"/><text x="76" y="206">CHANNELS/</text>
            <rect x="64" y="222" width="190" height="32" fill="none" stroke="#F4F1EA" stroke-width="3"/><text x="76" y="244" fill="#F4F1EA">CHANGELOG.MD</text>
          </g>
          <g font-family="'IBM Plex Mono',monospace" font-size="9.5" letter-spacing="1.2" fill="#C8CDD3">
            <text x="266" y="91">WORDS</text><text x="266" y="129">LOGO · COLOUR</text><text x="266" y="167">AI IMAGES</text><text x="266" y="205">ONE PER CHANNEL</text><text x="266" y="243">WHICH WINS</text>
          </g>
          <text x="8" y="292" fill="#C8CDD3" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1.6">CLASH? IT ASKS WHICH WINS, THEN LOGS IT</text>
        </svg>
      </div>
    </div>
  </div>

</div>
</body>
</html>
