<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logos/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/logos/apple-touch-icon.png">
<title>Your Business in Your Words · Magnum AI</title>
<meta name="description" content="About ten minutes, mostly tapping. Your answers become the voice file every social post is written from.">
<meta name="author" content="Magnum AI">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1F2A37">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFBF9; --paper-2:#FFFFFF; --navy:#1F2A37; --ink:#1E1B17;
    --body:#2B2823; --rust:#EF4029; --coral-text:#C63A2A; --coral-bright:#FF6F5E; --tint:#FBE1D8;
    --olive:#5B6B7A; --mute:#63615C;
    --on-navy:#F4F1EA; --on-navy-mute:#C8CDD3;
    --display:'Oswald','Arial Narrow',sans-serif;
    --sans:'IBM Plex Sans',Arial,system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);font-size:17px;line-height:1.55}
  .wrap{max-width:680px;margin:0 auto;padding:0 20px 60px}
  .masthead{background:var(--navy);color:var(--on-navy);border-bottom:4px solid var(--coral-bright);padding:30px 20px 22px;margin:0 -20px 24px}
  .crumb{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral-bright);margin:0 0 10px}
  .crumb a{color:var(--coral-bright)}
  h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(32px,7vw,52px);line-height:.95;margin:0;color:var(--on-navy)}
  h1 em{font-style:normal;color:var(--coral-bright)}
  .bar{height:8px;background:var(--paper);border:2px solid var(--ink);margin:0 0 8px}
  .bar i{display:block;height:100%;width:0;background:var(--rust);transition:width .25s}
  .count{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 18px}
  .card{background:var(--paper-2);border:2px solid var(--ink);padding:24px 22px 26px}
  .card h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(24px,5.4vw,32px);line-height:1.05;color:var(--ink);margin:0 0 8px}
  .hint{color:var(--mute);margin:0 0 18px;font-size:16px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 6px}
  .chip{font:inherit;font-size:16px;background:var(--paper-2);color:var(--ink);border:2px solid var(--ink);padding:10px 16px;cursor:pointer;min-height:48px;text-align:left}
  .chip[aria-pressed="true"]{background:var(--navy);color:#FFFFFF;border-color:var(--navy)}
  .chip[aria-pressed="true"]::before{content:"✓ ";color:var(--coral-bright)}
  .chip:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--coral-bright);outline-offset:2px}
  label.f{display:block;font-weight:500;color:var(--ink);margin:14px 0 6px}
  input[type=text],textarea{width:100%;padding:12px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper-2);border:2px solid var(--ink);border-radius:0}
  textarea{min-height:110px;resize:vertical}
  .eg{font-size:15px;color:var(--mute);margin:8px 0 0}
  .eg b{color:var(--ink);font-weight:500}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 0}
  .btn{font-family:var(--mono);font-size:14px;letter-spacing:.1em;text-transform:uppercase;border:2px solid var(--ink);padding:14px 22px;cursor:pointer;min-height:52px}
  .btn.go{background:var(--coral-bright);color:var(--ink)}
  .btn.back{background:transparent;color:var(--ink)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .skip{font:inherit;font-size:15px;background:none;border:none;color:var(--coral-text);text-decoration:underline;cursor:pointer;padding:8px 0}
  .start p{margin:0 0 12px}
  .start ul{margin:0 0 16px;padding-left:20px}
  .done{background:var(--navy);color:var(--on-navy);padding:24px 22px}
  .done h2{color:var(--on-navy)}
  .done p{color:var(--on-navy-mute);margin:0 0 14px}
  .done .btn{margin:0 10px 10px 0}
  .done .btn.back{color:var(--on-navy);border-color:var(--on-navy-mute)}
  .icorow{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 14px}
  .icorow svg{width:44px;height:44px;flex:none;display:block}
  .icorow span{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--on-navy-mute);text-align:right}
  pre#summary{white-space:pre-wrap;font-family:var(--mono);font-size:14px;line-height:1.5;background:var(--paper-2);color:var(--ink);border:2px solid var(--ink);padding:14px;max-height:320px;overflow:auto;margin:0 0 16px}
  #status{font-family:var(--mono);font-size:13px;color:var(--coral-bright);min-height:1.4em;margin:6px 0 0}
  footer{font-size:14px;color:var(--mute);margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="crumb"><a href="./">Social Media with AI</a> · Step 2</p>
    <h1>Your business <em>in your words</em></h1>
  </header>

  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <p class="count" id="count" aria-live="polite"></p>
  <main id="stage"></main>

  <footer>Magnum AI · Social Media with AI. Nothing you type here is sent anywhere. Your answers stay on this device until you copy them.</footer>
</div>
<script>
/* One question per screen. Taps first, typing only where only the owner can
   say it. Answers save on this device as they go (try/catch, so a private
   window still works). The copied text is plain, ready to paste under the
   voice file prompt. */
const KIND = {
  trade:'Builder or trade', shop:'Shop or retail', venue:'Pub, bar or venue',
  tours:'Tours or adventure', food:'Café or restaurant', care:'Health, beauty or fitness', other:'Something else'
};
const MUST = {
  trade:['Our licence number and licensed name on every post that sells work'],
  shop:['Prices shown as the customer pays them, including GST','“Australian made” only when it really is'],
  venue:['No drink prices, discounts or happy hours in any post','Accounts set to 18+','Nobody in photos who looks under 25'],
  tours:['Never “totally safe” or “suitable for everyone”','Safety gear visible in action shots'],
  food:['Prices shown as the customer pays them, including GST'],
  care:['No promises of results we cannot guarantee'],
  other:[]
};
const ALWAYS = ['A yes from anyone recognisable in a photo','No house numbers, number plates or addresses in photos','How to book, call or find us'];

const Q = [
 {id:'kind', t:'What kind of business are you?', h:'Pick the closest. It sets the rules your posts must follow.', type:'one', opts:Object.values(KIND), other:true},
 {id:'stage', t:'Where are you on social media today?', h:'No wrong answer. Most people start at the first one.', type:'one',
  opts:['Nothing yet, no accounts','Accounts, but we rarely post','We post, but it isn’t working','We post regularly and want it easier']},
 {id:'where', t:'Which ones do you use, or want to?', h:'Not sure? Tap Google, Facebook and Instagram. That covers most local businesses.', type:'many',
  opts:['Google Business Profile','Facebook','Instagram','LinkedIn','TikTok','Not sure yet']},
 {id:'name', t:'Your business name and where you work', type:'fields', fields:[
   ['Business name, exactly as customers know it','e.g. Coastline Joinery'],
   ['Suburbs, towns or areas you serve','e.g. Burleigh, Palm Beach, the southern Gold Coast']]},
 {id:'what', t:'What do you do?', h:'Say it like you would at a barbecue. One or two sentences. Tap the microphone on your keyboard and talk if that is easier.', type:'text',
  eg:'We build decks and pergolas for families on the southern Gold Coast, mostly hardwood.'},
 {id:'who', t:'Who is your favourite kind of customer?', h:'Describe one you would love ten more of.', type:'text',
  eg:'Couples in their 40s renovating their first proper home. They want it done once and done right.'},
 {id:'why', t:'Why do people pick you?', h:'Tap all that fit.', type:'many',
  opts:['Quality','Price','Speed','Friendly','Local','Experience','Range','Reliable','We explain things'], other:true},
 {id:'sound', t:'How do you sound to customers?', h:'Tap up to three.', type:'many', max:3,
  opts:['Friendly','Down to earth','Professional','Straight-talking','Warm','Funny','Expert','Relaxed','Energetic','Calm']},
 {id:'never', t:'What should you never sound like?', h:'Tap any that would make you cringe.', type:'many',
  opts:['Salesy','Corporate','Cheesy','Pushy','Over the top','Stiff','Try-hard','Know-it-all']},
 {id:'humour', t:'Do you use humour?', type:'one', opts:['Never','Sometimes','Often']},
 {id:'week', t:'What happens in a normal week that people would like to see?', h:'Tap all that happen. These become your posts.', type:'many',
  opts:['Jobs finished','Before and after','New stock','Events','The team','Behind the scenes','Customer questions answered','Specials'], other:true},
 {id:'ask', t:'What do customers always ask you?', h:'One or two questions. Each one is a ready-made post.', type:'text', optional:true,
  eg:'How long does a deck take? Do you do council approval?'},
 {id:'off', t:'Anything you never want posted?', h:'Tap any, or add your own.', type:'many', optional:true,
  opts:['Prices','Competitors','Staff faces','Customers’ homes','Politics','Complaints'], other:true},
 {id:'photos', t:'Where will the photos come from?', type:'many', opts:['My phone','Staff phones','A photographer','Stock photos','No idea yet']},
 {id:'check', t:'Who checks each post before it goes out?', h:'Someone always does. It takes ten seconds a post.', type:'one', opts:['Me','A staff member','Someone else'], other:true},
 {id:'must', t:'What must every post get right?', h:'We have ticked the usual ones for your kind of business. Untick any that do not apply, add anything else.', type:'many', must:true, other:true},
 {id:'licence', t:'Any licence number that must appear?', h:'Builders need their QBCC number on posts that sell work. Leave it blank if this is not you.', type:'fields', optional:true, fields:[
   ['Licence name and number, exactly as it must appear','e.g. Coastline Joinery Pty Ltd, QBCC 1234567']]},
 {id:'proud', t:'Got something you wrote that sounds like you?', h:'A post, an email, a text to a customer. Paste it in. Skip if not.', type:'text', optional:true}
];

const KEY='magnum-social-q2';
let A={}, i=-1;
try{A=JSON.parse(localStorage.getItem(KEY)||'{}');i=A.__i??-1;}catch(e){}
const save=()=>{A.__i=i;try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};
const stage=document.getElementById('stage'), fill=document.getElementById('fill'), count=document.getElementById('count');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function kindKey(){const v=A.kind&&A.kind.pick;return Object.keys(KIND).find(k=>KIND[k]===v)||'other';}
function mustOpts(){return [...(MUST[kindKey()]||[]),...ALWAYS];}
function answered(q){
  const a=A[q.id]; if(q.optional) return true;
  if(!a) return false;
  if(q.type==='text') return (a.text||'').trim().length>0;
  if(q.type==='fields') return (a.f||[]).some(x=>(x||'').trim());
  return (a.pick&&(Array.isArray(a.pick)?a.pick.length:true))||(a.other||'').trim().length>0;
}
function render(){
  fill.style.width=Math.max(0,Math.min(100,((i+1)/(Q.length+1))*100))+'%';
  if(i<0){count.textContent='About ten minutes · mostly tapping';
    stage.innerHTML=`<section class="card start"><h2>Let’s find your voice</h2>
      <p>Eighteen quick questions. Most are taps. A few ask you to type a sentence, and you can talk instead of typing.</p>
      <ul><li>No wrong answers.</li><li>You can stop and come back. It saves on this phone.</li><li>At the end you copy your answers in one tap.</li></ul>
      <div class="nav"><span></span><button class="btn go" id="next">Start</button></div></section>`;
    document.getElementById('next').onclick=()=>{i=0;save();render();};return;}
  if(i>=Q.length){count.textContent='Done';return renderDone();}
  const q=Q[i]; count.textContent=`Question ${i+1} of ${Q.length}`;
  const a=A[q.id]||(A[q.id]={});
  let body='';
  if(q.type==='one'||q.type==='many'){
    let opts=q.must?mustOpts():q.opts;
    if(q.must&&!a.init){a.pick=[...mustOpts()];a.init=1;}
    const pick=q.type==='one'?[a.pick]:(a.pick||[]);
    body=`<div class="chips" role="group" aria-label="${esc(q.t)}">${opts.map(o=>`<button type="button" class="chip" aria-pressed="${pick.includes(o)}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    if(q.other) body+=`<label class="f" for="oth">Something else? <span style="font-weight:400;color:var(--mute)">(optional)</span></label><input type="text" id="oth" value="${esc(a.other||'')}">`;
  } else if(q.type==='text'){
    body=`<textarea id="txt" aria-label="${esc(q.t)}">${esc(a.text||'')}</textarea>${q.eg?`<p class="eg"><b>For example:</b> ${esc(q.eg)}</p>`:''}`;
  } else if(q.type==='fields'){
    body=q.fields.map((f,k)=>`<label class="f" for="f${k}">${esc(f[0])}</label><input type="text" id="f${k}" placeholder="${esc(f[1])}" value="${esc((a.f||[])[k]||'')}">`).join('');
  }
  stage.innerHTML=`<section class="card"><h2>${esc(q.t)}</h2>${q.h?`<p class="hint">${esc(q.h)}</p>`:''}${body}
    <div class="nav"><button class="btn back" id="back">Back</button>
    ${q.optional?'<button class="skip" id="skip">Skip</button>':''}
    <button class="btn go" id="next">${i===Q.length-1?'Finish':'Next'}</button></div></section>`;
  const next=document.getElementById('next');
  const upd=()=>{next.disabled=!answered(q);};
  stage.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const o=b.dataset.o;
    if(q.type==='one'){a.pick=o;stage.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));}
    else{let p=a.pick||[];if(p.includes(o))p=p.filter(x=>x!==o);else{if(q.max&&p.length>=q.max)return;p=[...p,o];}a.pick=p;b.setAttribute('aria-pressed',p.includes(o));}
    save();upd();});
  const oth=document.getElementById('oth'); if(oth) oth.oninput=()=>{a.other=oth.value;save();upd();};
  const txt=document.getElementById('txt'); if(txt) txt.oninput=()=>{a.text=txt.value;save();upd();};
  stage.querySelectorAll('input[id^=f]').forEach((el,k)=>el.oninput=()=>{a.f=a.f||[];a.f[k]=el.value;save();upd();});
  document.getElementById('back').onclick=()=>{i--;save();render();};
  next.onclick=()=>{i++;save();render();window.scrollTo(0,0);};
  const sk=document.getElementById('skip'); if(sk) sk.onclick=()=>{i++;save();render();};
  upd();
  const first=stage.querySelector('.chip,textarea,input'); if(first&&i>0) first.focus({preventScroll:true});
}
function line(q){
  const a=A[q.id]||{};
  if(q.type==='text') return (a.text||'').trim();
  if(q.type==='fields') return q.fields.map((f,k)=>`${f[0]}: ${((a.f||[])[k]||'').trim()}`).filter(s=>!/: $/.test(s)).join('\n');
  const p=a.pick?(Array.isArray(a.pick)?a.pick:[a.pick]):[];
  return [...p,(a.other||'').trim()].filter(Boolean).join(', ');
}
function summary(){
  return 'MY BRAND QUESTIONNAIRE\n\n'+Q.map((q,k)=>`${k+1}. ${q.t}\n${line(q)||'(skipped)'}`).join('\n\n');
}
function renderDone(){
  fill.style.width='100%';
  stage.innerHTML=`<section class="done"><div class="icorow"><svg aria-label="Tick" viewBox="0 0 48 48" fill="none" stroke="#FF6F5E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="18"/><path d="M15 24 L21 31 L33 17"/></svg><span>Last step</span></div>
    <h2>That’s it. Nice work.</h2>
    <p>Copy your answers. Then paste them into Claude under the voice file prompt, or send them to whoever is setting this up with you.</p>
    <pre id="summary"></pre>
    <button class="btn go" id="copy">Copy my answers</button>
    <button class="btn back" id="edit">Change an answer</button>
    <button class="btn back" id="clear">Start again</button>
    <p id="status" aria-live="polite"></p></section>`;
  document.getElementById('summary').textContent=summary();
  const st=document.getElementById('status');
  document.getElementById('copy').onclick=async()=>{const t=summary();
    try{await navigator.clipboard.writeText(t);st.textContent='Copied. Now paste it where you need it.';}
    catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');st.textContent='Copied.';}catch(_){st.textContent='Copy did not work here. Press and hold the answers above, then copy.';}ta.remove();}};
  document.getElementById('edit').onclick=()=>{i=0;save();render();};
  document.getElementById('clear').onclick=()=>{if(!confirm('Clear every answer on this device?'))return;A={};i=-1;try{localStorage.removeItem(KEY)}catch(e){}render();};
}
render();
</script>
</body>
</html>
