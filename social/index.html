<!DOCTYPE html>
<html lang="en-AU">
<head>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF9;
  --paper-2:#FFFFFF;
  --ink:#1E1B17;
  --navy:#1F2A37;
  --coral-bright:#FF6F5E;
  --tint:#FBE1D8;
  --body:#2B2823;
  --rust:#EF4029;--coral-ghost-navy:#A1524E; --coral-text:#C63A2A;
  --olive:#5B6B7A;
  --olive-2:#46545F;
  --char:#3A3630;
  --mute:#63615C;
  --rule:#1E1B17;
  --grid:rgba(120,90,60,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1F2A37;color:var(--body);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:18px;line-height:1.45}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--rust);outline-offset:3px}

header{display:flex;align-items:center;justify-content:space-between;padding:14px 40px;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#C8CDD3}
header .brand{color:#FFFFFF;border-bottom:1px solid #FFFFFF;padding-bottom:2px;text-decoration:none}
header .brand:hover{color:#FF6F5E;border-bottom-color:#FF6F5E}
header .count{color:#FFFFFF}

main{flex:1;display:flex;padding:0 40px 8px;overflow:hidden}
#deck{flex:1;background:var(--ink);padding:10px;display:flex;overflow:hidden}
.slide{flex:1;display:none;padding:44px 64px 56px;overflow:auto;position:relative;
  background:var(--paper);
  
  border:3px solid var(--paper);box-shadow:inset 0 0 0 1px var(--ink)}
.slide.on{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-content:start}
.slide.has-fig.on{grid-template-columns:minmax(320px,6fr) minmax(360px,6fr)}
.slide.has-prompt.on{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:16px;align-content:stretch}
.slide.tiles.on{grid-template-columns:minmax(0,1fr)}

.kicker{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--coral-text);display:flex;align-items:center;gap:14px}
.kicker::after{content:"";flex:1;height:2px;background:var(--ink);max-width:420px}
h1{font-family:"Oswald",sans-serif;font-weight:600;font-size:58px;line-height:.98;text-transform:uppercase;letter-spacing:-.005em;max-width:18ch;color:var(--ink);margin-top:10px}
h1 .n{display:none}
h1 em{font-style:normal;color:var(--rust)}
.cover h1{font-size:132px;max-width:12ch;line-height:.92}
.cover.has-fig.on{grid-template-columns:minmax(360px,6fr) minmax(320px,5fr)}
.cover .sub{font-family:"Oswald",sans-serif;font-weight:500;font-size:30px;text-transform:uppercase;color:var(--rust);margin-top:12px}
.cover p{font-size:21px;color:var(--body);max-width:40ch;margin-top:18px;line-height:1.5}
.meta{margin-top:18px;padding-top:14px;border-top:2px solid var(--ink);font-family:"IBM Plex Mono",monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--body);line-height:2}
.meta b{color:var(--rust);font-weight:500;margin-right:10px}

ul.points{list-style:none;margin-top:6px;max-width:84ch}
.has-fig ul.points{max-width:56ch}
ul.points li{font-size:27px;line-height:1.32;padding:9px 0 9px 34px;border-top:1px solid rgba(30,27,23,.25);position:relative;color:var(--body)}
ul.points li:last-child{border-bottom:2px solid var(--ink)}
ul.points li::before{content:"";position:absolute;left:0;top:25px;width:18px;height:3px;background:var(--rust)}
ul.points li b{color:var(--rust);font-weight:500}
ul.points li code{font-family:"IBM Plex Mono",monospace;font-size:.82em;color:var(--ink);background:#fff8;border:1px solid var(--ink);padding:1px 6px}
.note{margin-top:8px;color:var(--mute);font-size:17px;max-width:52ch}
.left{display:flex;flex-direction:column;gap:18px;min-width:0}
.has-prompt h1,.has-fig h1{font-size:44px}
.slide.has-prompt{padding:26px 48px 52px}
.has-prompt .left{gap:6px}
.has-prompt h1{font-size:34px;max-width:none;margin-top:4px}
.has-prompt .foot{left:48px;right:48px}
.has-prompt ul.points{display:flex;flex-wrap:wrap;gap:0 32px;max-width:none;margin-top:2px;border-bottom:2px solid var(--ink)}
.has-prompt ul.points li{font-size:max(15px,calc(14px / var(--z,1)));line-height:1.3;padding:6px 0 6px 22px;border-top:0;flex:1 1 28%;min-width:220px}
.has-prompt ul.points li:last-child{border-bottom:0}
.has-prompt ul.points li::before{top:13px;width:12px}
.has-fig ul.points li{font-size:24px}

/* figure panel */
.fig{background:var(--navy);border:2px solid var(--ink);padding:26px 26px 18px;display:flex;flex-direction:column;gap:14px;align-self:start;}
.fig svg{width:100%;height:auto;max-height:50vh;display:block}
.fig .cap{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#F4F1EA;border-top:1px solid rgba(244,241,234,.35);padding-top:10px;line-height:1.7}

/* tile grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.tile{padding:20px 20px 24px;color:var(--paper);min-height:150px;border:2px solid var(--ink)}
.tile h3{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px;opacity:.9}
.tile p{font-size:22px;line-height:1.35}
.tile.o{background:var(--olive)}.tile.t{background:var(--rust)}.tile.c{background:var(--char)}
.tile.b{background:var(--coral-bright);color:var(--ink)}
/* A tile carrying an icon is a card, so it stands portrait and the icon gets
   room. Scoped with :has so the plain tile grids are untouched. */
.tile:has(.ticon){min-height:300px;display:flex;flex-direction:column;padding-top:26px}
.tile .ticon{display:block;margin:0 0 auto}
.tile .ticon svg{width:112px;height:90px;display:block;--accent:var(--paper)}
.tile.b .ticon svg{--accent:var(--paper)}
.tile:has(.ticon) h3{margin-bottom:8px}
.tile.b h3{opacity:1}

/* before / after split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.split div{border:2px solid var(--ink);background:var(--paper-2);padding:0;}
.split h3{font-family:"Oswald",sans-serif;font-weight:500;font-size:20px;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;color:var(--paper);border-bottom:2px solid var(--ink)}
.split .b h3{background:var(--navy)}.split .a h3{background:var(--rust)}
.split p{font-family:"IBM Plex Mono",monospace;font-size:19px;line-height:1.5;margin:14px 20px;color:var(--ink)}

/* agenda rows: step, what, why */
.rows{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.3fr);border:2px solid var(--ink);background:var(--paper-2);margin-top:8px}
.rows > div{padding:11px 18px;border-top:1px solid rgba(30,27,23,.3);font-size:21px;line-height:1.3;color:var(--body)}
.rows > div:nth-child(-n+3){border-top:0;background:var(--navy);color:#F4F1EA;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:9px 18px}
.rows .step{font-family:"Oswald",sans-serif;font-weight:600;font-size:22px;text-transform:uppercase;color:var(--rust);letter-spacing:.01em;white-space:nowrap}
.rows .step b{display:inline-block;width:1.6em;color:var(--ink)}
.slide.has-rows.on{grid-template-columns:minmax(0,1fr)}
.has-rows h1{font-size:44px}
/* do-this badge, top right */
.dotag{position:absolute;top:26px;right:34px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;background:var(--coral-bright);color:var(--ink);padding:7px 14px;border:2px solid var(--ink);}
/* chevron steps */
.chev{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.chev span{background:var(--rust);color:var(--paper);font-family:"Oswald",sans-serif;font-size:17px;letter-spacing:.06em;padding:14px 26px 14px 30px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%);text-transform:uppercase}
.chev span:first-child{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%)}
.chev span:nth-child(even){background:var(--char)}
.chev span:last-child{background:var(--olive)}

/* prompt pane */
.pane{background:var(--paper-2);border:2px solid var(--ink);display:flex;flex-direction:column;min-height:0;min-width:0;}
.pane-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:var(--navy);color:#F4F1EA;font-family:"Oswald",sans-serif;font-size:19px;letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid var(--ink)}
.copy{background:var(--rust);color:var(--paper);border:2px solid var(--ink);padding:7px 16px;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.14em;transition:background .15s}
.copy:hover{background:#c8402f}
.copy.done{background:var(--olive)}
.prewrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
pre{font-family:"IBM Plex Mono",monospace;font-size:max(14px,calc(15px / var(--z,1)));line-height:1.42;white-space:pre-wrap;padding:14px 20px 22px;overflow:auto;flex:1;color:var(--ink)}
.prewrap::after{content:"More below \2193";position:absolute;left:0;right:0;bottom:0;padding:38px 0 8px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral-text);background:linear-gradient(rgba(228,218,196,0),var(--paper-2) 62%);pointer-events:none;opacity:0;transition:opacity .15s}
.pane.more .prewrap::after{opacity:1}
.btns{display:flex;gap:8px}
.expand{background:transparent;color:var(--paper);border:2px solid var(--paper);padding:7px 14px;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.14em}
.expand:hover{border-color:#FF6F5E;color:#FF6F5E}
#reader{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:5}
#reader.on{display:flex}
#reader .rhead{display:flex;align-items:center;justify-content:space-between;padding:16px 40px;background:var(--navy);color:#F4F1EA;font-family:"Oswald",sans-serif;font-size:22px;letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid var(--ink)}
#reader pre{font-size:19px;line-height:1.6;padding:36px 64px 60px;max-width:92ch;width:100%;margin:0 auto;box-sizing:border-box}
#reader .rclose{background:transparent;color:var(--paper);border:2px solid var(--paper);padding:7px 14px;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.14em}
#reader .rclose:hover{border-color:#FF6F5E;color:#FF6F5E}
.after{border-top:2px solid var(--ink);background:var(--paper)}
.after summary{padding:8px 18px;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.after summary::after{content:"+";color:var(--rust);font-size:20px;line-height:1}
.after[open] summary::after{content:"\2212"}
.after ol{list-style:none;counter-reset:s;padding:0 18px 16px;font-size:16px;color:var(--body)}
.after ol li{counter-increment:s;margin:8px 0;padding-left:44px;position:relative;min-height:28px}
.after ol li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:0;background:var(--navy);color:#F4F1EA;font-family:"IBM Plex Mono",monospace;font-size:12px;padding:3px 6px;letter-spacing:.1em}

.foot{position:absolute;left:64px;right:64px;bottom:18px;border-top:2px solid var(--ink);padding-top:8px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.foot b{color:var(--ink);font-weight:500}

footer{display:flex;align-items:center;justify-content:space-between;padding:12px 40px}
.nav{display:flex;gap:8px}
.nav button{background:transparent;color:#FFFFFF;border:1px solid var(--olive);padding:8px 18px;font-family:"IBM Plex Mono",monospace;letter-spacing:.16em;font-size:12px}
.nav button:hover{border-color:#FFFFFF}
.nav button.on{background:var(--rust);border-color:var(--rust)}
#menulist li.basic button::after{content:"basics";grid-column:2;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8E97A3;margin-top:2px}
.menu.skip #menulist li.basic button{opacity:.38}
.bar{flex:1;height:3px;background:#3A4756;margin:0 28px;position:relative}
.bar i{position:absolute;left:0;top:0;height:100%;background:var(--paper);transition:width .25s}
.hint{color:#8E97A3;font-size:12px;font-family:"IBM Plex Mono",monospace;letter-spacing:.08em}

#menu{position:fixed;inset:0;background:rgba(31,42,55,.975);display:none;padding:56px 80px;overflow:auto;color:#FFFFFF}
#menu.on{display:block}
#menu h2{font-family:var(--display);font-weight:700;font-size:40px;line-height:.95;letter-spacing:-.005em;text-transform:uppercase;color:#FFFFFF;margin:0 0 26px;padding-top:14px;border-top:3px solid #FF6F5E}
#menu ol{list-style:none;columns:2;column-gap:64px;max-width:1060px}
#menu li{break-inside:avoid;margin:0 0 2px}
#menu li.sec{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;letter-spacing:-.005em;text-transform:uppercase;color:#FFFFFF;margin:26px 0 10px;padding-top:10px;border-top:2px solid rgba(244,241,234,.26)}
#menu li:first-child.sec{margin-top:0}
#menulist button{background:none;border:0;color:#C8CDD3;font-size:17px;text-align:left;padding:5px 0;width:100%;
  display:grid;grid-template-columns:42px 1fr;align-items:baseline;gap:0 14px;transition:color .14s ease}
#menulist button .n{font-family:var(--display);font-weight:700;font-size:23px;line-height:1;
  color:var(--coral-ghost-navy);transition:color .14s ease}
#menulist button:hover,#menulist button:focus-visible{color:#FFFFFF}
#menulist button:hover .n,#menulist button:focus-visible .n{color:#FF6F5E}
@media(prefers-reduced-motion:reduce){#menulist button,#menulist button .n{transition:none}}
#menu .close{position:fixed;top:20px;right:40px;color:#FFFFFF;background:transparent;border:1px solid #C8CDD3;padding:8px 18px;font-family:"IBM Plex Mono",monospace;letter-spacing:.16em;font-size:12px}
#menu .close:hover{border-color:#FFFFFF;color:#FF6F5E}

@media (max-width:1000px){
  main{padding:0 12px 8px}
  .slide{padding:28px 22px 60px}
  .slide.has-fig.on{grid-template-columns:1fr}
  .has-prompt ul.points li{flex-basis:100%}
  .grid,.split{grid-template-columns:1fr}
  h1{font-size:38px}.cover h1{font-size:56px}
  ul.points li{font-size:20px}
  .foot{left:22px;right:22px}
  header,footer{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="../">MAGNUM AI</a>
  <span class="section" id="sec"></span>
  <span class="count" id="count"></span>
</header>
<main id="deck"></main>
<footer>
  <div class="nav"><button id="prev">BACK</button><button id="next">NEXT</button><button id="menubtn" onclick="toggleMenu()">SLIDES</button><button id="skipbtn" onclick="toggleSkip()" hidden>SKIP BASICS</button></div>
  <div class="bar"><i id="fill"></i></div>
  <span class="hint">Arrow keys move. SLIDES for the full list.</span>
</footer>
<div id="menu"><button class="close" onclick="toggleMenu()">CLOSE ✕</button><h2>Slides</h2><ol id="menulist"></ol></div>
<div id="reader"><div class="rhead"><span id="rwhere"></span><div class="btns"><button class="copy" id="rcopy" data-i="0">COPY PROMPT</button><button class="rclose" onclick="closeReader()">CLOSE ✕</button></div></div><pre id="rpre"></pre></div>

<script>
const P1 = `Role: You are a social media researcher who studies what the best small
businesses in one industry actually post, and why it works for them.

Context: I run [type of business] in [town or region], Australia, and I
post on [which platforms]. I want to see what good looks like in my
industry before I decide how my own posts should sound. This is research
to learn from, not to copy.

Constraints: Look at real accounts and published guidance from the last
12 months, and name your sources, because I will check the examples
myself. Focus on small and medium businesses like mine, not national
brands with marketing teams, because their budgets set a bar I cannot
use. Say what the good ones do in plain words, not marketing jargon.
Include any rules or common mistakes specific to my industry, such as
licence numbers, alcohol or safety wording, because getting those wrong
costs more than a weak post. If something is a guess rather than
something you found, say so.

Tone: Plain and practical, like a mate in the same trade telling me what
works.

Format: Five short sections. 1. What the best ones post: the five post
types that work, with an example of each. 2. How they sound: three words
for the typical voice, and what the standouts do differently. 3. How
often they post, and on which platforms. 4. Mistakes to avoid in this
industry. 5. Three accounts worth looking at, with one line on why.

Output: The five sections, then one line headed THE GAP TO CLOSE FIRST:
the single biggest difference between what the best do and what a
typical business in my industry does.`;

const P2 = `Role: You are a blunt social media editor who has reviewed thousands of
small business accounts and knows what makes a customer scroll past.

Context: Below are my last posts, copied from [which platforms], newest
first. I run [type of business]. I want to know what is working, what
sounds like everyone else, and what is missing, before I change anything.

Constraints: Judge only what I have pasted, because I will act on this.
Quote the actual line when you praise or criticise it, so I can see what
you mean. Say when a post could belong to any business in my industry,
because that is the most common problem and the easiest to fix. Do not
tell me to post more often; that is not the question today.

Tone: Honest and specific. Friendly, but do not soften the findings.

Format: A scorecard under three headings: SOUNDS LIKE US, SOUNDS LIKE
EVERYONE, MISSING. Up to four points under each.

Output: The scorecard, then the three changes that would make the
biggest difference, in order. Stop there.`;

const P3 = `Role: You are a copywriter who can hear how an owner really talks and
write it down so anyone could copy it.

Context: Below are three things: my answers to the brand questionnaire,
[three to five posts, emails or messages I am proud of], and [ten to
twenty of my Google reviews, copied word for word]. Turn them into a
voice file that will guide every post written for my business from now
on.

Constraints: Base everything on what I have pasted, and quote the words
that support each point, because a voice file built on guesses writes
posts that sound like someone else. Describe what I do rather than
adjectives: "short sentences, first names, one joke at most" beats
"friendly". Pull out the phrases customers use about us, because those
are the words new customers trust. Never turn a review into a new quote
or change its wording, because that is misleading under Australian
Consumer Law. Copy every must-always line from the questionnaire exactly
as written.

Tone: Plain. Write it so a new staff member could follow it on day one.

Format: These headings, in this order: WHO WE TALK TO. HOW WE SOUND,
as three "this, not that" pairs. WORDS WE USE. WORDS WE NEVER USE. WHAT
WE POST. WHERE WE POST, with each platform we use and who approves.
WHAT WE NEVER POST OR CLAIM. MUST ALWAYS INCLUDE. CUSTOMER WORDS.

Output: The voice file, under 400 words, in Australian English. Then one
line listing anything you still need from me.`;

const P4 = `Role: You write social posts for this business, the way the owner would
if they had the time.

Context: I have attached a photo. It shows [what it is, and anything
worth knowing, in one line]. Use the voice file in this project for how
we sound and what we must always include.

Constraints: Use only what is in the photo, my line above and the voice
file. Never invent a customer, a result, a price, a date or a quote,
because a made-up detail in a public post is the fastest way to lose
trust. If a post needs a detail you do not have, write [CHECK] in its
place. Mention one specific thing you can see in the photo, because a
real detail is what makes a post sound like a person was there. Use
at most one emoji and never a dash to join two thoughts, because both
are the quickest signs a machine wrote it. Write each platform its own
way rather than one post copied across, because each one is read
differently.

Tone: As the voice file says.

Format: One labelled version for each platform listed in the voice
file, and none for any we do not use. LINKEDIN: three to five lines on
the work and what it shows about how we do things. INSTAGRAM: two to four
short lines, then up to three hashtags. FACEBOOK: three to five lines,
conversational and local, ending with one next step. GOOGLE: two plain
lines and a next step, no hashtags.

Output: The versions, then one line headed NOT CONFIRMED listing
anything marked [CHECK].`;

const P5 = `Role: You write offers that people act on without feeling sold to.

Context: The offer is [what it is, and who it is for]. The price is [the
exact figure the customer pays, including GST]. It runs [start and end
dates]. Use the voice file in this project.

Constraints: Use the offer, the price and the dates exactly as written,
because a wrong price in a public post is a promise and can breach
consumer law. Show prices to customers including GST, because that is
the price they pay. Add no conditions, extras, stock levels or urgency I
have not given you, such as "last chance", because false urgency is
misleading. If the voice file has must-always lines for offers, such as a licence
number or an 18+ note, include them. If we are a licensed venue, never
put a drink price, drink discount or happy hour in a post, because
Queensland liquor law restricts advertising them outside the venue.

Tone: As the voice file says. Clear first, friendly second.

Format: One labelled version for each platform listed in the voice
file. Put the dates on their own line in each.

Output: The versions, then one line repeating the price and dates
exactly as used, so I can check them against my own.`;

const P6 = `Role: You are the owner of this business, answering a customer in
public.

Context: Here is the review or comment, word for word, and where it was
posted: [paste it]. Use the voice file in this project.

Constraints: Answer what they actually said, in as few words as it
needs, because a long reply to a short comment reads like a script. Use
only facts from their words, the voice file or what I tell you, because
a wrong detail in public is worse than none. If they ask about a price,
stock or a date you do not have, say we will message them. If it is a
complaint, thank them, do not argue, and move it to a private message or
a phone call. Offer no refund, discount or promise unless I tell you
to, because a public offer binds us. Never share anything private about
the customer, because it is their information, not ours.

Tone: As the voice file says. Warm if they are happy. Calm and brief if
they are not.

Format: Two options, labelled SHORTER and WARMER, each under 60 words.

Output: The two options, then one line headed BEFORE YOU POST listing
anything I should check.`;

const P7 = `Role: You plan and write a week of social posts for a busy owner who
has fifteen minutes to approve them.

Context: This week: [what is happening: jobs, stock, events, anything
real]. The photos are attached. Use the voice file in this project for
how we sound, what we post and what we must always include.

Constraints: Build every post from something real I have given you,
because a filler post about nothing does more harm than a quiet week.
Never invent a customer, a result, a price, a date or an event. Write
each post for each platform we use, in that platform's style. If Buffer
is connected, save every post as a draft in the right channel and never
publish or schedule it, because I approve everything before it goes out.
If Buffer is not connected, give me the posts in a table instead.

Tone: As the voice file says.

Format: Three to five posts across the week. For each one: the day, the
platforms, the photo it uses, and the text.

Output: Confirm what went into Buffer as drafts, channel by channel,
then list anything marked [CHECK]. Stop there.`;

const P8 = `Role: You are this business's social media writer, working on your own
once a week.

Context: Every Monday at 7am, read the photos and notes added to [the
folder name] since last Monday. Use the voice file in this project for
how we sound and what we must always include.

Constraints: You cannot ask me anything, so where a detail is missing,
write [CHECK] and carry on. Never invent a customer, a result, a price,
a date or a quote. Save every post as a draft in Buffer, in the right
channel, and never publish or schedule anything, because I approve every
post from my phone. Never delete or move anything in the folder. If
nothing new was added, say so in one line and stop, because a quiet week
and a broken job should never look the same.

Tone: As the voice file says.

Format: Up to five posts, each written for every platform we use.

Output: A short note at the top with the date and time you ran, how
many drafts went into Buffer by channel, and anything marked [CHECK].
Then stop.`;

const P9 = `Role: You are an editor tuning a brand voice file from evidence.

Context: Below is the voice file in this project, and [a few of last
month's drafts, copied from the chats or task runs, each next to how it
finally went out]. I want
the voice file to need fewer edits next month.

Constraints: Change only what my edits show, and quote the edit behind
each change, because the file should follow how I actually write. Look
for patterns: words I always cut, lines I always add, a tone I keep
softening. Keep every must-always line unless I say otherwise.

Tone: Straight and short.

Format: A list of changes, each with the edit that caused it, then the
full updated voice file.

Output: Both, ready to save over the old file.`;

const deck = document.getElementById('deck');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const flow=t=>{const out=[];for(const raw of t.split('\n')){const l=raw.replace(/\s+$/,'');const prev=out.length?out[out.length-1]:'';const item=x=>/^\s*([-\u2022*]|\d+[.)])\s/.test(x)||/^[A-Z][A-Z0-9 ]{2,}:/.test(x);const indented=/^\s+\S/.test(raw);if(l===''){out.push('');}else if(prev!==''&&(indented||/^[a-z]/.test(l)||(!item(l)&&!item(prev)))){out[out.length-1]=prev+' '+l.trim();}else{out.push(l);}}return out.join('\n');};

S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.prompt?' has-prompt':'') + (s.cover?' cover':'') + (s.tiles?' tiles':'') + (s.rows?' has-rows':'') + (s.fig?' has-fig':'');
  const num = i===0 ? '' : `<span class="n">${i}</span>`;
  let left = `<div class="left">`;
  if(s.sec) left += `<div class="kicker">${s.sec}</div>`;
  left += `<h1>${s.h}</h1>`;
  if(s.sub) left += `<div class="sub">${s.sub}</div>`;
  if(s.chev) left += `<div class="chev">${s.chev.map(c=>`<span>${c}</span>`).join('')}</div>`;
  if(s.rows){ const hd=s.rowhead||["Step","What we do","Why it matters"]; const num=!s.rowhead; left += `<div class="rows"><div>${hd[0]}</div><div>${hd[1]}</div><div>${hd[2]}</div>${s.rows.map((r,i)=>`<div class="step">${num?`<b>${i+1}</b>`:''}${r[0]}</div><div>${r[1]}</div><div>${r[2]}</div>`).join('')}</div>`; }
  if(s.tiles) left += `<div class="grid">${s.tiles.map(t=>`<div class="tile ${t[0]}">${t[3]?`<span class="ticon">${ICONS[t[3]]||''}</span>`:''}<h3>${t[1]}</h3><p>${t[2]}</p></div>`).join('')}</div>`;
  if(s.pts&&s.pts.length) left += `<ul class="points">${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  if(s.split) left += `<div class="split"><div class="b"><h3>${s.split[0][0]}</h3>${s.split[0].slice(1).map(t=>`<p>${t}</p>`).join('')}</div><div class="a"><h3>${s.split[1][0]}</h3>${s.split[1].slice(1).map(t=>`<p>${t}</p>`).join('')}</div></div>`;
  if(s.note) left += `<p class="note">${s.note}</p>`;
  if(s.meta) left += `<div class="meta">${s.meta.map(m=>`<div><b>${m[0]}</b>${m[1]}</div>`).join('')}</div>`;
  left += `</div>`;
  let right = '';
  if(s.fig){ right = `<div class="fig">${F[s.fig][0]}<div class="cap">${F[s.fig][1]}</div></div>`; }
  if(s.prompt){
    right = `<div class="pane">
      <div class="pane-head"><span class="where">${s.where}</span><div class="btns"><button class="expand" data-i="${i}">EXPAND</button><button class="copy" data-i="${i}">COPY PROMPT</button></div></div>
      <div class="prewrap"><pre>${esc(flow(s.prompt))}</pre></div>
      <details class="after"><summary>What to do with this</summary><ol>${s.after.map(a=>`<li>${a}</li>`).join('')}</ol></details>
    </div>`;
  }
  const badge = `<div class="foot"><span>Magnum AI / Reference</span><span>${s.sec||'Social'}</span><b>${String(i).padStart(2,'0')} / ${S.length-1}</b></div>`;
  const dotag = (s.tag==='do' || s.prompt) ? '<div class="dotag">Do this now</div>' : '';
  el.innerHTML = left + right + badge + dotag;
  deck.appendChild(el);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('on',i===cur));
  document.getElementById('sec').textContent=S[cur].sec;
  document.getElementById('count').textContent=cur===0?'':`${cur} / ${slides.length-1}`;
  document.getElementById('fill').style.width=(cur/(slides.length-1)*100)+'%';
  history.replaceState(null,'',cur?('#'+cur):location.pathname);
  slides[cur].scrollTop=0;
  checkMore();
}
// Skip basics: slides marked basic:true drop out of Next and Back when the
// switch is on, so one deck serves a room that already knows the basics.
let skip=/[?&]short\b/.test(location.search);
const hasBasics=S.some(s=>s.basic);
function step(d){let n=cur+d;while(skip&&n>0&&n<slides.length&&S[n].basic)n+=d;if(n<0||n>slides.length-1)return;show(n);}
function toggleSkip(){skip=!skip;paintSkip();if(skip&&S[cur].basic)step(1);}
function paintSkip(){const b=document.getElementById('skipbtn');b.hidden=!hasBasics;b.classList.toggle('on',skip);b.textContent=skip?'BASICS OFF':'SKIP BASICS';document.getElementById('menu').classList.toggle('skip',skip);}
document.getElementById('next').onclick=()=>step(1);
document.getElementById('prev').onclick=()=>step(-1);
document.addEventListener('keydown',e=>{
  if(document.getElementById('reader').classList.contains('on')){if(e.key==='Escape')closeReader();return;}
  if(document.getElementById('menu').classList.contains('on')&&e.key==='Escape'){toggleMenu();return;}
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();step(1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();step(-1);}
  if(e.key==='m'||e.key==='M'){toggleMenu();}
  if(e.key==='b'||e.key==='B'){toggleSkip();}
});

document.querySelectorAll('.copy').forEach(b=>{

    const t=S[+b.dataset.i].prompt;
    try{await navigator.clipboard.writeText(t);}
    catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
    b.textContent='COPIED';b.classList.add('done');
    setTimeout(()=>{b.textContent='COPY PROMPT';b.classList.remove('done');},1800);
  };
});

const ml=document.getElementById('menulist');
let lastSec=null;
S.forEach((s,i)=>{
  if(i===0)return;
  if(s.sec!==lastSec){const h=document.createElement('li');h.className='sec';h.textContent=s.sec;ml.appendChild(h);lastSec=s.sec;}
  const li=document.createElement('li');if(s.basic)li.className='basic';
  const b=document.createElement('button');
  const n=document.createElement('span');n.className='n';n.textContent=String(i).padStart(2,'0');
  const t=document.createElement('span');t.textContent=s.h.replace(/<\/?em>/g,'');
  b.appendChild(n);b.appendChild(t);b.onclick=()=>{show(i);toggleMenu();};
  li.appendChild(b);ml.appendChild(li);
});
function checkMore(){document.querySelectorAll('.slide.on .pane').forEach(p=>{const pre=p.querySelector('.prewrap pre');if(!pre)return;p.classList.toggle('more',pre.scrollHeight-pre.clientHeight-pre.scrollTop>8);});}
document.querySelectorAll('.prewrap pre').forEach(pre=>pre.addEventListener('scroll',checkMore));
window.addEventListener('resize',checkMore);
document.querySelectorAll('.expand').forEach(b=>{b.onclick=()=>{const s=S[+b.dataset.i];document.getElementById('rwhere').textContent=s.where;document.getElementById('rpre').textContent=flow(s.prompt);document.getElementById('rcopy').dataset.i=b.dataset.i;document.getElementById('reader').classList.add('on');document.getElementById('rpre').scrollTop=0;};});
function closeReader(){document.getElementById('reader').classList.remove('on');}
function toggleMenu(){document.getElementById('menu').classList.toggle('on');}
paintSkip();
document.getElementById('menu').addEventListener('click',e=>{if(e.target.id==='menu'){toggleMenu();}});

// Fit every slide to the screen. The decks are laid out for a box of
// FIT_W by FIT_H (the tallest slide at a 1440-wide window) and scaled to
// whatever the deck area actually is, so nothing spills past the box and
// the footer never prints over the last line. One zoom for the whole deck
// keeps the text size consistent from slide to slide. Prompt text and the
// points beside it hold a real-pixel floor (see the pre rule in the CSS) so
// a small window scrolls the prompt rather than shrinking it.
const FIT_W=1340, FIT_H=770;
function fit(){
  const r=document.getElementById('deck').getBoundingClientRect();
  const z=Math.max(0.4,Math.min((r.width-20)/FIT_W,(r.height-20)/FIT_H,1.35));
  document.querySelectorAll('.slide').forEach(s=>{s.style.zoom=z;});
  document.documentElement.style.setProperty('--z',z); // prompt text floors read this
  checkMore();
}
window.addEventListener('resize',fit);
fit();
show(parseInt(location.hash.slice(1))||0);
</script>
