<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>{{TITLE}} · card</title>
<!--
  CARD TEMPLATE · guides, manuals and session decks
  ================================================
  The 1200x630 card used on the members area and when a link is shared.
  Same anatomy as the Field Note card so the whole set reads as one family:
  masthead, headline block, rust figure plate, footer strip.

  To make one: copy this file, replace every {{SLOT}}, then render at exactly
  1200x630 with a real browser, quality 90, and save the JPEG to assets/thumbnails/.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEE6D3;
  --paper-deep:#E4DAC4;
  --ink:#1E1B17;
  --rust:#B8452A;
  --tan:#C9A87C;
  --olive:#6C7A3F;
  --charcoal:#3A3630;
  --taupe:#9C8D77;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#4A453D;font-family:'IBM Plex Sans',Arial,sans-serif;color:var(--ink)}

.card{
  width:1200px;height:630px;
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 18% 12%, rgba(156,141,119,.16) 0 2px, transparent 2px),
    radial-gradient(circle at 72% 34%, rgba(156,141,119,.13) 0 2px, transparent 2px),
    radial-gradient(circle at 42% 78%, rgba(184,69,42,.07) 0 3px, transparent 3px),
    radial-gradient(circle at 88% 66%, rgba(108,122,63,.08) 0 2px, transparent 2px),
    repeating-linear-gradient(92deg, rgba(30,27,23,.028) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(2deg, rgba(30,27,23,.022) 0 1px, transparent 1px 6px),
    linear-gradient(160deg, rgba(255,250,238,.55), rgba(198,181,152,.28));
  background-size:26px 26px,34px 34px,48px 48px,40px 40px,auto,auto,auto;
  border:11px solid var(--ink);
  padding:34px 42px 26px;
  display:flex;flex-direction:column;
}

.masthead{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:4px solid var(--ink);padding-bottom:12px;gap:16px}
.mh-title{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:700;font-size:23px;letter-spacing:.16em;text-transform:uppercase;line-height:1;display:block}
.mh-sub{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--charcoal);display:block;margin-top:8px}
.mh-issue{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:600;font-size:19px;letter-spacing:.1em;border:3px solid var(--ink);padding:4px 14px 5px;background:var(--paper-deep);white-space:nowrap}

.body{flex:1;display:grid;grid-template-columns:1.2fr .8fr;gap:34px;padding-top:24px;min-height:0}

.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--rust);display:flex;align-items:center;gap:12px}
.eyebrow::after{content:"";flex:1;height:3px;background:var(--ink);opacity:.85}

/* EDIT 1 · headline size can be nudged if the headline runs long */
h1{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:700;text-transform:uppercase;line-height:.94;letter-spacing:-.005em;font-size:{{H1SIZE}};margin-top:16px}
.kicker{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.03em;color:var(--rust);margin-top:16px}
.slug{margin-top:auto;border-top:3px solid var(--ink);padding-top:12px;display:flex;gap:26px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--charcoal)}
.slug b{font-weight:600;color:var(--rust)}
.left{display:flex;flex-direction:column;min-height:0}

.plate{background:var(--rust);border:4px solid var(--ink);padding:20px 22px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:0;overflow:hidden}
.doc-wrap{flex:1 1 0;display:flex;align-items:center;justify-content:center;padding-bottom:6px;min-height:0}
.doc-wrap svg{width:auto;height:100%;max-width:100%;display:block}
.doc{position:relative;width:56%;aspect-ratio:.72;background:var(--paper);border:4px solid var(--ink);padding:12% 13%;
  box-shadow:6px 6px 0 rgba(30,27,23,.16),12px 12px 0 rgba(30,27,23,.13),18px 18px 0 rgba(30,27,23,.10),24px 24px 0 rgba(30,27,23,.07),30px 30px 0 rgba(30,27,23,.05)}
.doc i{display:block;height:6px;background:var(--charcoal);opacity:.75;margin-bottom:11px}
.doc i:nth-child(1){width:70%;height:10px;opacity:1;background:var(--ink)}
.doc i:nth-child(3){width:88%}
.doc i:nth-child(4){width:62%}
.doc i:nth-child(5){width:80%}
.doc i:nth-child(6){width:45%;background:var(--rust);opacity:1}
.tick{position:absolute;right:-15%;bottom:-12%;width:40%;aspect-ratio:1;border-radius:50%;background:var(--olive);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center}
.tick::after{content:"";width:42%;height:22%;border-left:6px solid var(--paper);border-bottom:6px solid var(--paper);transform:rotate(-45deg) translate(6%,-18%)}
.plate-cap{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#F6ECDC;border-top:3px solid rgba(246,236,220,.5);padding-top:10px;margin-top:14px;line-height:1.6}

.foot{border-top:3px solid var(--ink);margin-top:20px;padding-top:11px;display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--charcoal)}
.foot .mid{color:var(--taupe)}
.foot .pg{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<div class="card">

  <header class="masthead">
    <div>
      <span class="mh-title">{{KIND}}</span>
      <span class="mh-sub">Magnum AI</span>
    </div>
    <!-- EDIT 2 · issue number -->
    <div class="mh-issue">{{BADGE}}</div>
  </header>

  <div class="body">
    <div class="left">
      <!-- EDIT 3 · theme, headline, kicker -->
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1>{{HEADLINE}}</h1>
      <div class="kicker">{{KICKER}}</div>
      <div class="slug">
        <span><b>{{SLUG1K}}</b> {{SLUG1V}}</span>
        <span><b>{{SLUG2K}}</b> {{SLUG2V}}</span>
      </div>
    </div>

    <div class="plate">
      <div class="doc-wrap">
{{FIGURE}}
      </div>
      <div class="plate-cap">{{CAP}}<br>Published by Magnum AI</div>
    </div>
  </div>

  <footer class="foot">
    <span>{{FOOT1}}</span>
    <!-- EDIT 4 · footer strapline -->
    <span class="mid">{{FOOT2}}</span>
    <span class="pg">Magnum AI</span>
  </footer>

</div>
</body>
</html>
