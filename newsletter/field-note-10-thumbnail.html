<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Field Note No. 10 · social thumbnail</title>
<!--
  THUMBNAIL SOURCE · Weekly Field Note No. 10, Options
  ===================================================
  This is the 1200x630 social card that shows up when a Field Note link is
  shared (email, LinkedIn, WhatsApp, Slack) and as the cover image on the
  members area home page.

  To make one for a new issue:
    1. Copy this file, change the four bits marked EDIT below.
    2. Render it to a JPEG at exactly 1200x630, quality 90 (any headless browser will do):
         Use a real browser at a true 1200x630 viewport. A headless --window-size
         screenshot scales the page and ships a cropped card.
    3. Save the PNG as assets/thumbnails/field-note-NN-slug.png
    4. Point the issue's og:image meta tag at it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF9;
  --ink:#1E1B17;
  --navy:#1F2A37;
  --coral-bright:#FF6F5E;
  --on-navy:#F4F1EA;
  --on-navy-mute:#C8CDD3;
}
*{box-sizing:border-box;margin:0;padding:0}
/* Since 17 Oct the card matches the This Week in AI preview: the issue's
   cartoon on the left, a navy title panel on the right. */
body{width:1200px;height:630px;overflow:hidden;background:var(--navy);font-family:'IBM Plex Sans',Arial,sans-serif}
.card{display:flex;width:1200px;height:630px}
.pic{position:relative;width:690px;height:630px;overflow:hidden;background:var(--paper);border-right:6px solid var(--coral-bright);flex:none}
.pic .ill{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.numtag{position:absolute;top:22px;left:22px;font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase;line-height:1;background:var(--coral-bright);color:var(--ink);border:3px solid var(--ink);padding:5px 13px 6px}
.cap{position:absolute;left:0;right:0;bottom:0;background:var(--navy);color:var(--on-navy);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;line-height:1.6;padding:10px 18px 12px}
.panel{flex:1;min-width:0;background:var(--navy);padding:54px 46px 40px;display:flex;flex-direction:column}
.k{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral-bright)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-navy-mute);margin-top:22px}
h1{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:700;text-transform:uppercase;line-height:.96;font-size:60px;color:var(--on-navy);margin-top:14px}
.kicker{font-family:'Oswald','Arial Narrow','Liberation Sans Narrow',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.03em;color:var(--coral-bright);margin-top:20px}
.foot{margin-top:auto;border-top:2px solid rgba(244,241,234,.35);padding-top:12px;display:flex;justify-content:space-between;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--on-navy-mute)}
.foot b{color:var(--on-navy);font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div class="card">

  <div class="pic">
    <!-- EDIT 2 · this issue has no cartoon of its own yet: the Higgsfield
         connector was not in this session, so it points at the archive's
         stand-in picture. The Wednesday picture top-up task swaps in a real
         one and bumps the ?v= on the share image. -->
    <img class="ill" src="../assets/illustrations/newsletter.jpg" alt="">
    <div class="numtag">No. 10</div>
    <div class="cap">Fig. 10 / New picture on its way<br>Illustration: Magnum AI</div>
  </div>

  <div class="panel">
    <div class="k">Weekly Field Note</div>
    <div class="eyebrow">Before you pick one</div>
    <h1>Get Claude to give you five options, not one.</h1>
    <div class="kicker">Fill in the brackets. Paste it.</div>
    <div class="foot">
      <span>Skip the obvious answer</span>
      <b>Magnum AI</b>
    </div>
  </div>

</div>
<script>
/* Shrink the headline until the panel fits, so a long headline never spills. */
(function(){var p=document.querySelector('.panel'),h=document.querySelector('.panel h1'),s=60;
while(p.scrollHeight>p.clientHeight&&s>34){s-=2;h.style.fontSize=s+'px';}})();
</script>
</body>
</html>
